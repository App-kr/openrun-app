plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// key.properties ?β돦裕녻キ?(Git ?怨뺣뾼????戮곕뇶 ??.gitignore 嶺뚣볦굣??
def keyPropertiesFile = rootProject.file("key.properties")
def keyProperties = new Properties()
if (keyPropertiesFile.exists()) {
    keyProperties.load(new FileInputStream(keyPropertiesFile))
}

android {
    namespace "com.taekit.app"

    // compileSdk 36: ????롥윜諛몄굣??shared_preferences, sqflite, url_launcher) ??븐럥?????
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.taekit.app"
        // Android 5.0+ (?熬곣뫕?????덇덧?β돦裕????リ옇?쀧뵳??99%+ ??ｋ걞??
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode 23
        versionName "1.0.6"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keyProperties['keyAlias']
            // CI/CD ???삵렱?곌떠?????⑥ろ맖, ??怨몃さ嶺?key.properties ????
            keyPassword System.getenv("KEYSTORE_PASS") ?: keyProperties['keyPassword']
            storeFile keyProperties['storeFile'] ? file(keyProperties['storeFile']) : null
            storePassword System.getenv("KEYSTORE_PASS") ?: keyProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            // ??븐뼚?붷윜? ??類ｌ┫????怨몃쾳, ??類ㅺ뎄 ?リ옇???
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.release
            // R8 ??嶺뚮ㅄ維獄???類ｌ┫??+ ?洹먮봾爰???怨뺣깹??(APK ????~40% ?띠룆흮??
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    // ????キ?嶺뚣끉裕???
    bundle {
        language {
            // ??蹂λ윟????⑤챶?좂춯?????(?뺢퀡?꾥キ?????嶺뚣끉裕???
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // Java 8+ API ?????(minSdk 21 ????
    // Firebase SDK ?뺢퀗???? Flutter ????롥윜諛몄굣??firebase_core, firebase_messaging)????㉱??
    // BoM???곌랙?х뙴??怨뺣뼺???濡?듆 Flutter ????롥윜諛몄굣???リ옇?? ?뺢퀗???뤒??寃몃쳳???띠럾???????蹂ㅽ깴
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
