plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// key.properties 嚥≪뮆諭?(Git ?곕뗄????뽰뇚 ??.gitignore 筌〓챷??
def keyPropertiesFile = rootProject.file("key.properties")
def keyProperties = new Properties()
if (keyPropertiesFile.exists()) {
    keyProperties.load(new FileInputStream(keyPropertiesFile))
}

android {
    namespace "com.taekit.app"

    // compileSdk 36: ???쑎域밸챷??shared_preferences, sqflite, url_launcher) ?遺쎈럡??鍮?
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.taekit.app"
        // Android 5.0+ (?袁⑷퍥 ??덈굡嚥≪뮇???疫꿸퀗由??99%+ ?뚣끇苡?
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode 22
        versionName "1.0.6"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keyProperties['keyAlias']
            // CI/CD ??띻펾癰궰???怨쀪퐨, ??곸몵筌?key.properties ????
            keyPassword System.getenv("KEYSTORE_PASS") ?: keyProperties['keyPassword']
            storeFile keyProperties['storeFile'] ? file(keyProperties['storeFile']) : null
            storePassword System.getenv("KEYSTORE_PASS") ?: keyProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            // ?遺얠쒔域? ??뺣즴????곸벉, ??뺤구 疫꿸퀡??
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.release
            // R8 ??筌뤴뫀諭???뺣즴??+ ?귐딅꺖???곕벡??(APK ??由?~40% 揶쏅Ŋ??
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    // ??슢諭?筌ㅼ뮇???
    bundle {
        language {
            // ??볥럢???怨몃선筌???釉?(甕곕뜄諭???由?筌ㅼ뮇???
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // Java 8+ API ?????(minSdk 21 ????
    // Firebase SDK 甕곌쑴??? Flutter ???쑎域밸챷??firebase_core, firebase_messaging)???온??
    // BoM??癰귢쑬猷??곕떽???롢늺 Flutter ???쑎域밸챷??疫꿸퀡? 甕곌쑴?얏??겸뫖猷?揶쎛??????볤탢
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
