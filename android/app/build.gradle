plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// key.properties 濡쒕뱶 (Git 異붿쟻 ?쒖쇅 ??.gitignore 李몄“)
def keyPropertiesFile = rootProject.file("key.properties")
def keyProperties = new Properties()
if (keyPropertiesFile.exists()) {
    keyProperties.load(new FileInputStream(keyPropertiesFile))
}

android {
    namespace "com.taekit.app"

    // compileSdk 36: ?뚮윭洹몄씤(shared_preferences, sqflite, url_launcher) ?붽뎄?ы빆
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.taekit.app"
        // Android 5.0+ (?꾩껜 ?덈뱶濡쒖씠??湲곌린??99%+ 而ㅻ쾭)
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode 21
        versionName "1.0.6"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keyProperties['keyAlias']
            // CI/CD ?섍꼍蹂???곗꽑, ?놁쑝硫?key.properties ?ъ슜
            keyPassword System.getenv("KEYSTORE_PASS") ?: keyProperties['keyPassword']
            storeFile keyProperties['storeFile'] ? file(keyProperties['storeFile']) : null
            storePassword System.getenv("KEYSTORE_PASS") ?: keyProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            // ?붾쾭洹? ?쒕룆???놁쓬, ?쒕챸 湲곕낯
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.release
            // R8 ?紐⑤뱶 ?쒕룆??+ 由ъ냼??異뺤냼 (APK ?ш린 ~40% 媛먯냼)
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    // 鍮뚮뱶 理쒖쟻??
    bundle {
        language {
            // ?쒓뎅???곸뼱留??ы븿 (踰덈뱾 ?ш린 理쒖냼??
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // Java 8+ API ??샇??(minSdk 21 ???
    // Firebase SDK 踰꾩쟾? Flutter ?뚮윭洹몄씤(firebase_core, firebase_messaging)??愿由?
    // BoM??蹂꾨룄 異붽??섎㈃ Flutter ?뚮윭洹몄씤 湲곕? 踰꾩쟾怨?異⑸룎 媛?????쒓굅
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
